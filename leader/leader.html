<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PANEL PROWADZĄCEGO - FAMILIADA ZSK</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <link rel="stylesheet" href="styleL.css">
</head>
<body>

    <div id="top-bar">
        <div><span id="st-round-label">RUNDA:</span> <span id="st-round" class="stat-val">-</span></div>
        <div>MNOŻNIK: <span id="st-mult" class="stat-val">x1</span></div>
        <div><span id="st-pot-label">PULA RUNDY:</span> <span id="st-pot" class="stat-val">0</span></div>
    </div>

    <div id="scoreboard-zone">
        <div id="host-team-1" class="team-score-box">
            <div id="host-name-1" class="t-name">LEWA</div>
            <div id="host-score-1" class="t-score">0</div>
            <div id="host-str-1" class="t-strikes"></div>
        </div>
        
        <div id="host-status-box">
            <div id="status-text">OCZEKIWANIE...</div>
            <div id="narada-text">MOŻE SIĘ NARADZAĆ: ...</div>
        </div>

        <div id="host-team-2" class="team-score-box">
            <div id="host-name-2" class="t-name">PRAWA</div>
            <div id="host-score-2" class="t-score">0</div>
            <div id="host-str-2" class="t-strikes"></div>
        </div>
    </div>

    <div id="chat-zone">
        <div id="chat-popup">REŻYSER: <span id="chat-msg">...</span></div>

        <div id="host-timer-box">
            <div style="background: var(--red); color: white; border-radius: 8px; display: flex; align-items: center; justify-content: space-between; padding: 10px 25px; box-shadow: 0 0 15px rgba(255, 51, 51, 0.3);">
                <span style="font-weight: bold; font-size: 16px;">CZAS (STOPER):</span>
                <span id="host-timer-val" style="font-size: 32px; font-weight: 900; font-family: monospace;">20</span>
            </div>
        </div>
    </div>

    <div id="q-zone">
        <div class="card-q"><h2 id="q-text">ŁĄCZENIE Z REŻYSERKĄ...</h2></div>
    </div>

    <div id="ans-zone"></div>

    <div id="footer">
        <div style="display:flex; align-items:center; flex:1;">
            <div id="conn-dot" class="dot"></div>
            <span id="conn-text">SZUKAM...</span>
        </div>
        <div style="display:flex; gap: 8px; justify-content:center; flex:2;">
            <button class="host-btn btn-rules" onclick="showInstructionLocally()">ZASADY</button>
            <button class="host-btn btn-alert" onclick="sendAlertToDirector()">BŁĄD DO REŻ.</button>
        </div>
        <div style="flex:1; text-align:right;">SYNC: <span id="last-sync" style="color:var(--gold)">--:--:--</span></div>
    </div>

    <div id="instruction-modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:10000; align-items:center; justify-content:center; flex-direction:column; padding: 20px; box-sizing: border-box;">
        <div id="instruction-content" style="background:#111; border: 2px solid var(--gold); padding: 20px; border-radius: 10px; max-width: 600px; color: white;">
            </div>
        <button onclick="document.getElementById('instruction-modal').style.display='none'" style="margin-top:20px; padding: 15px 30px; font-size:18px; font-weight:bold; background:var(--red); color:white; border:none; border-radius:8px; cursor:pointer;">ZAMKNIJ (ZROZUMIANO)</button>
    </div>

    <script src="logicL.js"></script>
</body>
</html>
